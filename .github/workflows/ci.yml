name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: livehive
          POSTGRES_PASSWORD: livehive
          POSTGRES_DB: livehive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://livehive:livehive@localhost:5432/livehive_test
      DIRECT_URL: postgresql://livehive:livehive@localhost:5432/livehive_test
      AUTH_SECRET: ci-auth-secret-ci-auth-secret-ci-12
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      APP_URL: http://localhost:3000
      CRON_SECRET: ci-cron-secret
      CI: 'true'
      RUN_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run lint
      - run: npm run build
