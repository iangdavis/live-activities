services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: livehive
      POSTGRES_PASSWORD: livehive
      POSTGRES_DB: livehive
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U livehive']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
